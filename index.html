<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Humanizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 20px; font-size: 24px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
    textarea { width: 100%; height: 180px; padding: 12px; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 10px; font-size: 16px; margin-bottom: 16px; resize: vertical; }
    button { width: 100%; padding: 16px; background: #0284c7; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.2s; }
    button:active { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .output-group { margin-top: 24px; }
  </style>
</head>
<body>

  <h1>AI Humanizer Engine</h1>

  <label for="aiInput">Paste AI Text Here:</label>
  <textarea id="aiInput" placeholder="Paste text generated by ChatGPT or Claude..."></textarea>

  <button id="humanizeBtn" onclick="processText()">Humanize Text</button>

  <div class="output-group">
    <label for="humanOutput">Humanized Result:</label>
    <textarea id="humanOutput" readonly placeholder="Your humanized text will appear here..."></textarea>
  </div>

  <script>
    // REPLACE THIS URL with your live Render backend URL!
    const BACKEND_URL = 'https://my-ai-humanizer-api.onrender.com/api/humanize-advanced';

    async function processText() {
      const input = document.getElementById('aiInput').value;
      const btn = document.getElementById('humanizeBtn');
      const output = document.getElementById('humanOutput');

      if (!input.trim()) {
        alert('Please paste some text first!');
        return;
      }

      btn.innerText = 'Bypassing AI Detectors...';
      btn.disabled = true;
      output.value = '';

      try {
        const res = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: input, intensity: 'high' })
        });
        
        const data = await res.json();
        
        if (data.humanized_text) {
          output.value = data.humanized_text;
        } else {
          alert('Error processing text. Check your backend status.');
        }
      } catch (err) {
        alert('Could not connect to backend server. Make sure your Render URL is correct.');
      } finally {
        btn.innerText = 'Humanize Text';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
